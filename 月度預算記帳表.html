<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月度預算記帳表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1F2EC;
    --paper-raised: #FBFBF8;
    --ink: #20302B;
    --ink-soft: #56645E;
    --rule: #D6D3C4;
    --rule-strong: #B7B3A0;
    --cash: #A9792C;
    --cash-bg: #F4EBD9;
    --linepay: #2F7D5B;
    --linepay-bg: #E4F0E9;
    --card: #33456E;
    --card-bg: #E5E8F0;
    --buffer: #7A3B49;
    --buffer-bg: #F1E3E5;
    --warn: #B23B3B;
    --warn-bg: #F7E4E1;
    --shadow: 0 1px 2px rgba(32,48,43,0.06), 0 4px 14px rgba(32,48,43,0.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(32,48,43,0.035) 28px),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    padding:36px 20px 80px;
    min-height:100vh;
  }
  .wrap{max-width:880px;margin:0 auto;}

  /* header */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px; margin-bottom:0; flex-wrap:wrap; gap:14px;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.16em;
    color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif TC', serif; font-weight:900; font-size:30px;
    margin:0; letter-spacing:.01em;
  }
  .month-control{display:flex; align-items:center; gap:10px;}
  .month-control select{
    font-family:'IBM Plex Mono', monospace; font-size:14px; padding:8px 10px;
    border:1.5px solid var(--ink); background:var(--paper-raised); color:var(--ink);
    border-radius:3px; cursor:pointer;
  }

  /* tabs */
  .tabs{
    display:flex; gap:2px; margin-bottom:28px; border-bottom:1.5px solid var(--rule-strong);
  }
  .tab-btn{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:14.5px;
    background:none; border:none; padding:13px 20px 11px; cursor:pointer;
    color:var(--ink-soft); position:relative; top:1.5px;
    border-bottom:3px solid transparent;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); }
  .tab-btn:hover{ color:var(--ink); }
  .page{ display:none; }
  .page.active{ display:block; }

  /* summary strip */
  .summary{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
    background:var(--rule-strong); border:1.5px solid var(--ink);
    margin-bottom:28px; box-shadow:var(--shadow);
  }
  .summary .cell{background:var(--paper-raised); padding:16px 14px;}
  .summary .cell .label{font-size:11px; color:var(--ink-soft); letter-spacing:.04em; margin-bottom:6px;}
  .summary .cell .value{font-family:'IBM Plex Mono', monospace; font-size:21px; font-weight:600;}
  .summary .cell .value.neg{color:var(--warn);}
  .summary .cell .sub{font-size:11px; color:var(--ink-soft); margin-top:4px;}

  /* savings toggle bar */
  .savings-bar{
    display:flex; align-items:center; gap:12px; justify-content:space-between;
    background:var(--paper-raised); border:1.5px solid var(--rule-strong); border-left:5px solid var(--ink);
    padding:13px 16px; margin-bottom:30px; border-radius:2px; flex-wrap:wrap;
  }
  .savings-bar .txt{font-size:13.5px; line-height:1.5;}
  .savings-bar .txt b{font-family:'IBM Plex Mono', monospace;}
  .toggle{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:12px; white-space:nowrap;
  }
  .toggle input{width:16px; height:16px; accent-color:var(--ink); cursor:pointer;}

  /* envelope grid */
  .section-title{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:17px;
    margin:0 0 14px; display:flex; align-items:baseline; gap:8px;
  }
  .section-title .n{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); font-weight:400;}
  .envelopes{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:14px; margin-bottom:12px;
  }
  .envelope{
    background:var(--paper-raised); border:1.5px solid var(--rule-strong);
    border-radius:3px; padding:16px 15px 14px; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .envelope::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:var(--accent);
  }
  .env-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;}
  .env-name{font-family:'Noto Serif TC', serif; font-weight:700; font-size:15px;}
  .env-use{font-family:'Noto Sans TC'; font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .stamp{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; position:relative;
    background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--accent-bg) 0);
  }
  .stamp::after{
    content:""; position:absolute; width:40px; height:40px; border-radius:50%;
    background:var(--paper-raised);
  }
  .stamp .pctnum{
    position:relative; z-index:1; font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; color:var(--accent);
  }
  .stamp.over{background:conic-gradient(var(--warn) 100%, var(--accent-bg) 0);}
  .stamp.over .pctnum{color:var(--warn);}
  .env-nums{font-family:'IBM Plex Mono', monospace;}
  .env-nums .spent{font-size:19px; font-weight:600;}
  .env-nums .cap{font-size:12px; color:var(--ink-soft);}
  .env-remain{font-size:11.5px; margin-top:8px; color:var(--ink-soft);}
  .env-remain b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
  .env-remain.over-txt b{color:var(--warn);}
  .cap-edit{
    margin-top:10px; display:flex; align-items:center; gap:6px;
  }
  .cap-edit label{font-size:10px; color:var(--ink-soft); white-space:nowrap;}
  .cap-edit input{
    width:100%; font-family:'IBM Plex Mono',monospace; font-size:12px;
    border:1px solid var(--rule); border-radius:2px; padding:4px 6px; background:transparent;
  }

  .card-note{
    font-size:11.5px; color:var(--ink-soft); background:var(--card-bg); border:1px dashed var(--card);
    padding:9px 12px; border-radius:2px; margin-bottom:30px; line-height:1.6;
  }
  .card-note b{color:var(--card); font-family:'IBM Plex Mono',monospace;}
  .bind-toggle{display:inline-flex; align-items:center; gap:6px; margin-left:4px; cursor:pointer;}
  .bind-toggle input{accent-color:var(--card); cursor:pointer;}

  /* add form */
  form.add-tx{
    background:var(--paper-raised); border:1.5px solid var(--ink); border-radius:3px;
    padding:18px; margin-bottom:30px; box-shadow:var(--shadow);
  }
  .add-tx .grid{
    display:grid; grid-template-columns:1fr 1fr 1fr 1.4fr auto; gap:10px; align-items:end;
  }
  .field label{display:block; font-size:10.5px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.03em;}
  .field input, .field select{
    width:100%; font-family:'Noto Sans TC', sans-serif; font-size:13.5px;
    padding:9px 10px; border:1.3px solid var(--rule-strong); border-radius:2px;
    background:var(--paper); color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--ink);}
  .add-tx button{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:14px;
    background:var(--ink); color:var(--paper-raised); border:none; border-radius:2px;
    padding:10px 20px; cursor:pointer; white-space:nowrap;
  }
  .add-tx button:hover{opacity:.88;}
  .add-tx .err{color:var(--warn); font-size:12px; margin-top:10px; display:none;}
  .add-tx-top{
    border-width:2px; margin-bottom:26px;
    position:sticky; top:12px; z-index:5;
    background:var(--paper-raised);
  }
  .add-tx-top button{
    background:var(--linepay);
  }

  /* ledger */
  .ledger{background:var(--paper-raised); border:1.5px solid var(--rule-strong); border-radius:3px; box-shadow:var(--shadow); overflow:hidden;}
  .ledger table{width:100%; border-collapse:collapse;}
  .ledger thead th{
    text-align:left; font-size:10.5px; letter-spacing:.05em; color:var(--ink-soft);
    padding:11px 14px; border-bottom:1.5px solid var(--ink); font-weight:500;
  }
  .ledger tbody td{
    padding:11px 14px; border-bottom:1px solid var(--rule); font-size:13px; vertical-align:middle;
  }
  .ledger tbody tr:last-child td{border-bottom:none;}
  .ledger tbody tr:hover{background:rgba(32,48,43,0.025);}
  .method-tag{
    display:inline-flex; align-items:center; gap:6px; font-size:12px;
    font-family:'IBM Plex Mono',monospace;
  }
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .amt{font-family:'IBM Plex Mono',monospace; text-align:right; font-weight:600;}
  .note-cell{color:var(--ink-soft);}
  .del-btn{
    background:none; border:1px solid var(--rule-strong); color:var(--ink-soft);
    border-radius:2px; width:26px; height:26px; cursor:pointer; font-size:13px; line-height:1;
  }
  .del-btn:hover{border-color:var(--warn); color:var(--warn);}
  .empty-row td{text-align:center; color:var(--ink-soft); padding:34px 14px; font-size:13px;}

  /* ===== stats page ===== */
  .stats-grid{
    display:grid; grid-template-columns:1.1fr 1fr; gap:20px; margin-bottom:26px;
  }
  .panel{
    background:var(--paper-raised); border:1.5px solid var(--rule-strong); border-radius:3px;
    padding:18px; box-shadow:var(--shadow);
  }
  .panel h3{
    font-family:'Noto Serif TC', serif; font-size:14.5px; margin:0 0 16px; font-weight:700;
  }

  /* donut */
  .donut-wrap{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .donut{
    width:140px; height:140px; border-radius:50%; flex-shrink:0; position:relative;
  }
  .donut::after{
    content:""; position:absolute; inset:26px; border-radius:50%; background:var(--paper-raised);
    display:flex;
  }
  .donut-center{
    position:absolute; inset:26px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:1; text-align:center;
  }
  .donut-center .tot{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;}
  .donut-center .lbl{font-size:9.5px; color:var(--ink-soft); margin-top:2px;}
  .legend{display:flex; flex-direction:column; gap:9px; flex:1; min-width:150px;}
  .legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .legend-row .dot{width:9px; height:9px; border-radius:50%;}
  .legend-row .lname{flex:1;}
  .legend-row .lval{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .legend-row .lpct{font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:11px; width:38px; text-align:right;}

  /* bar chart (daily) */
  .bars{
    display:flex; align-items:flex-end; gap:2px; height:130px; padding-top:8px;
    border-bottom:1.5px solid var(--ink); overflow-x:auto;
  }
  .bar-col{
    flex:1 0 6px; min-width:6px; display:flex; align-items:flex-end; justify-content:center; height:100%;
  }
  .bar-col .bar{
    width:100%; background:var(--card); border-radius:1.5px 1.5px 0 0; min-height:1px;
    transition:opacity .12s;
  }
  .bar-col .bar.today{background:var(--warn);}
  .bar-col:hover .bar{opacity:.7;}
  .bars-axis{display:flex; justify-content:space-between; font-size:10px; color:var(--ink-soft); margin-top:6px; font-family:'IBM Plex Mono',monospace;}

  /* envelope stat table */
  .stat-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .stat-table th{
    text-align:left; font-size:10px; color:var(--ink-soft); letter-spacing:.04em;
    padding:8px 6px; border-bottom:1.5px solid var(--ink); font-weight:500;
  }
  .stat-table td{padding:9px 6px; border-bottom:1px solid var(--rule); font-family:'IBM Plex Mono',monospace;}
  .stat-table td.name{font-family:'Noto Sans TC',sans-serif; display:flex; align-items:center; gap:7px;}
  .stat-table .mini-bar{
    height:5px; border-radius:3px; background:var(--rule); overflow:hidden; margin-top:5px; width:100%;
  }
  .stat-table .mini-bar-fill{height:100%; border-radius:3px;}
  .stat-table td.right{text-align:right;}

  /* month compare */
  .compare-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--rule);
  }
  .compare-row:last-child{border-bottom:none;}
  .compare-row .lbl{font-size:13px;}
  .compare-row .lbl .sub{display:block; font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
  .compare-row .val{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; text-align:right;}
  .delta{font-size:11px; margin-top:2px; font-family:'IBM Plex Mono',monospace;}
  .delta.up{color:var(--warn);}
  .delta.down{color:var(--linepay);}

  .top-notes{display:flex; flex-direction:column; gap:8px;}
  .top-note-row{display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--rule);}
  .top-note-row:last-child{border-bottom:none;}
  .top-note-row .amt{font-family:'IBM Plex Mono',monospace; font-weight:600;}

  footer{margin-top:26px; text-align:center; font-size:11px; color:var(--ink-soft);}

  @media (max-width:640px){
    .summary{grid-template-columns:repeat(2,1fr);}
    .add-tx .grid{grid-template-columns:1fr 1fr;}
    .add-tx .grid .field:nth-child(4){grid-column:1/-1;}
    .add-tx .grid button{grid-column:1/-1;}
    .ledger{overflow-x:auto;}
    .ledger table{min-width:560px;}
    .stats-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand-eyebrow">財富自由追蹤 · 支付方式分帳本</div>
      <h1>月度預算記帳表</h1>
    </div>
    <div class="month-control">
      <select id="monthSelect"></select>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-page="ledgerPage">記帳</button>
    <button class="tab-btn" data-page="statsPage">數據統計</button>
  </nav>

  <!-- ===================== 記帳頁面 ===================== -->
  <div class="page active" id="ledgerPage">

    <form class="add-tx add-tx-top" id="addForm">
      <div class="grid">
        <div class="field">
          <label>日期</label>
          <input type="date" id="txDate" required>
        </div>
        <div class="field">
          <label>金額</label>
          <input type="number" id="txAmount" min="0" step="1" placeholder="0" required autofocus>
        </div>
        <div class="field">
          <label>支付方式</label>
          <select id="txMethod" required></select>
        </div>
        <div class="field">
          <label>備註（選填）</label>
          <input type="text" id="txNote" placeholder="例如：午餐、超商">
        </div>
        <button type="submit">記一筆</button>
      </div>
      <div class="err" id="formErr"></div>
    </form>

    <div class="summary" id="summaryStrip"></div>

    <div class="savings-bar">
      <div class="txt">薪資入帳後，先把 <b>11,350 元</b> 轉到儲蓄／投資帳戶，不留在消費帳戶中。</div>
      <label class="toggle">
        <input type="checkbox" id="savingsToggle">
        已轉出本月儲蓄
      </label>
    </div>

    <div class="section-title">四個信封 <span class="n">CAP · 月上限（可點擊修改）</span></div>
    <div class="envelopes" id="envelopeGrid"></div>

    <div class="card-note" id="cardNote"></div>

    <div class="section-title">交易明細 <span class="n" id="txCount"></span></div>
    <div class="ledger">
      <table>
        <thead>
          <tr><th>日期</th><th>支付方式</th><th>備註</th><th style="text-align:right;">金額</th><th></th></tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ===================== 數據統計頁面 ===================== -->
  <div class="page" id="statsPage">

    <div class="stats-grid">
      <div class="panel">
        <h3>支付方式佔比</h3>
        <div class="donut-wrap">
          <div style="position:relative;">
            <div class="donut" id="donutChart"></div>
            <div class="donut-center">
              <div class="tot" id="donutTotal">$0</div>
              <div class="lbl">本月支出</div>
            </div>
          </div>
          <div class="legend" id="donutLegend"></div>
        </div>
      </div>

      <div class="panel">
        <h3>每日支出趨勢</h3>
        <div class="bars" id="dailyBars"></div>
        <div class="bars-axis" id="dailyAxis"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="panel">
        <h3>信封使用狀況</h3>
        <table class="stat-table" id="envStatTable"></table>
      </div>

      <div class="panel">
        <h3>與上個月比較</h3>
        <div id="monthCompare"></div>
      </div>
    </div>

    <div class="panel">
      <h3>消費備註排行（依累積金額）</h3>
      <div class="top-notes" id="topNotes"></div>
    </div>

  </div>

  <footer>資料儲存在你的帳號中，只有你看得到 · 每月上限可依實際情況調整</footer>
</div>

<script>
(function(){
  const ENVELOPE_DEFS = [
    { id:'cash',    name:'現金',       defaultCap:4000,  color:'--cash',    bg:'--cash-bg',    use:'傳統市場、停車、現金限定店家' },
    { id:'linepay', name:'LINE Pay',   defaultCap:8000,  color:'--linepay', bg:'--linepay-bg', use:'餐飲、超商、日常小額消費' },
    { id:'card',    name:'信用卡（主力卡）', defaultCap:15500, color:'--card', bg:'--card-bg', use:'固定帳單、交通、預先規劃的大額消費' },
    { id:'buffer',  name:'緊急緩衝金', defaultCap:3050,  color:'--buffer',  bg:'--buffer-bg',  use:'醫療、家庭臨時支出，不主動花掉' },
  ];
  const SAVINGS_TARGET = 11350;

  const CYCLE_START_DAY = 25; // 薪水入帳日：每月 25 號起算

  function pad(n){ return String(n).padStart(2,'0'); }
  function fmt(n){ return (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US'); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function stripTime(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function fmtMD(d){ return `${d.getMonth()+1}/${d.getDate()}`; }

  // 週期 key 用「起始月份」表示，例如 '2026-08' = 8/25 ~ 9/24
  function cycleKeyOf(d){
    const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
    if(day >= CYCLE_START_DAY) return y + '-' + pad(m);
    const prev = new Date(y, m-2, 1); // 上一個月
    return prev.getFullYear() + '-' + pad(prev.getMonth()+1);
  }
  function cycleStart(key){ const [y,m] = key.split('-').map(Number); return new Date(y, m-1, CYCLE_START_DAY); }
  function cycleEnd(key){ const [y,m] = key.split('-').map(Number); return new Date(y, m, CYCLE_START_DAY-1); }
  function daysInCycle(key){ return Math.round((cycleEnd(key) - cycleStart(key)) / 86400000) + 1; }
  function shiftCycleKey(key, offset){
    const [y,m] = key.split('-').map(Number);
    const d = new Date(y, m-1+offset, 1);
    return d.getFullYear() + '-' + pad(d.getMonth()+1);
  }
  function monthKeyOf(d){ return cycleKeyOf(d); } // 對應薪資週期
  function monthLabel(key){
    const s = cycleStart(key), e = cycleEnd(key);
    return `${s.getFullYear()}/${fmtMD(s)} – ${e.getFullYear()===s.getFullYear()?'':e.getFullYear()+'/'}${fmtMD(e)}`;
  }
  function prevMonthKey(key){ return shiftCycleKey(key, -1); }

  // 預設顯示：今天所在、或即將入帳的下一個薪資週期
  function defaultCycleKey(now){
    const day = now.getDate();
    if(day < CYCLE_START_DAY) return cycleKeyOf(new Date(now.getFullYear(), now.getMonth(), CYCLE_START_DAY));
    return cycleKeyOf(new Date(now.getFullYear(), now.getMonth()+1, CYCLE_START_DAY));
  }

  function buildMonthOptions(){
    const base = defaultCycleKey(new Date());
    const opts = [];
    for(let off=-2; off<=3; off++){
      opts.push(shiftCycleKey(base, off));
    }
    return opts;
  }

  let state = null;
  let currentMonth = null;
  let currentPage = 'ledgerPage';

  function defaultState(monthKey){
    return {
      monthKey,
      envelopes: ENVELOPE_DEFS.map(e => ({ id:e.id, cap:e.defaultCap })),
      transactions: [],
      savingsDone: false
    };
  }

  async function loadStateFor(monthKey){
    try{
      const res = await window.storage.get('budget:' + monthKey);
      if(res && res.value){
        const s = JSON.parse(res.value);
        ENVELOPE_DEFS.forEach(def => {
          if(!s.envelopes.find(e=>e.id===def.id)){
            s.envelopes.push({id:def.id, cap:def.defaultCap});
          }
        });
        return s;
      }
    }catch(e){}
    return defaultState(monthKey);
  }

  async function loadMonth(monthKey){
    state = await loadStateFor(monthKey);
    currentMonth = monthKey;
    render();
  }

  async function saveState(){
    try{
      await window.storage.set('budget:' + state.monthKey, JSON.stringify(state));
    }catch(e){
      console.error('儲存失敗', e);
    }
  }

  function capOf(id){ return state.envelopes.find(e=>e.id===id).cap; }
  function spentOf(id){
    return state.transactions.filter(t=>t.method===id).reduce((s,t)=>s+t.amount,0);
  }

  function switchPage(pageId){
    currentPage = pageId;
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id===pageId));
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.page===pageId));
    if(pageId === 'statsPage') renderStats();
  }

  function render(){
    renderMonthSelect();
    renderSummary();
    renderSavingsToggle();
    renderEnvelopes();
    renderCardNote();
    renderMethodSelect();
    renderLedger();
    if(currentPage === 'statsPage') renderStats();
  }

  function renderMonthSelect(){
    const sel = document.getElementById('monthSelect');
    if(sel.dataset.built !== '1'){
      buildMonthOptions().forEach(mk=>{
        const o = document.createElement('option');
        o.value = mk; o.textContent = monthLabel(mk);
        sel.appendChild(o);
      });
      sel.dataset.built = '1';
      sel.addEventListener('change', ()=> loadMonth(sel.value));
    }
    sel.value = currentMonth;
  }

  function renderSummary(){
    const totalCap = state.envelopes.reduce((s,e)=>s+e.cap,0);
    const totalSpent = state.transactions.reduce((s,t)=>s+t.amount,0);
    const remain = totalCap - totalSpent;
    const now = stripTime(new Date());
    const cs = stripTime(cycleStart(state.monthKey));
    const ce = stripTime(cycleEnd(state.monthKey));
    const daysInMonth = daysInCycle(state.monthKey);
    let dayIndex;
    if(now < cs) dayIndex = 0;
    else if(now > ce) dayIndex = daysInMonth;
    else dayIndex = Math.round((now - cs) / 86400000) + 1;
    const daysLeft = Math.max(daysInMonth - dayIndex, 0);
    const dailyLeft = daysLeft>0 ? remain/daysLeft : remain;

    const strip = document.getElementById('summaryStrip');
    strip.innerHTML = `
      <div class="cell"><div class="label">月支出上限</div><div class="value">${fmt(totalCap)}</div><div class="sub">四個信封合計</div></div>
      <div class="cell"><div class="label">已花費</div><div class="value">${fmt(totalSpent)}</div><div class="sub">${state.transactions.length} 筆交易</div></div>
      <div class="cell"><div class="label">剩餘可用</div><div class="value ${remain<0?'neg':''}">${fmt(remain)}</div><div class="sub">${remain<0?'已超支':'距月底還有 '+daysLeft+' 天'}</div></div>
      <div class="cell"><div class="label">每日可用（估）</div><div class="value ${dailyLeft<0?'neg':''}">${fmt(dailyLeft)}</div><div class="sub">依剩餘天數平均</div></div>
    `;
  }

  function renderSavingsToggle(){
    const cb = document.getElementById('savingsToggle');
    cb.checked = !!state.savingsDone;
    cb.onchange = async ()=>{ state.savingsDone = cb.checked; await saveState(); };
  }

  function renderEnvelopes(){
    const grid = document.getElementById('envelopeGrid');
    grid.innerHTML = '';
    ENVELOPE_DEFS.forEach(def=>{
      const cap = capOf(def.id);
      const spent = spentOf(def.id);
      const pct = cap>0 ? Math.min((spent/cap)*100,100) : 0;
      const over = spent > cap;
      const el = document.createElement('div');
      el.className = 'envelope';
      el.style.setProperty('--accent', `var(${def.color})`);
      el.style.setProperty('--accent-bg', `var(${def.bg})`);
      el.innerHTML = `
        <div class="env-head">
          <div>
            <div class="env-name">${def.name}</div>
            <div class="env-use">${def.use}</div>
          </div>
          <div class="stamp ${over?'over':''}" style="--pct:${over?100:pct}">
            <span class="pctnum">${Math.round(over?(spent/cap*100):pct)}%</span>
          </div>
        </div>
        <div class="env-nums">
          <div class="spent">${fmt(spent)}</div>
          <div class="cap">上限 ${fmt(cap)}</div>
        </div>
        <div class="env-remain ${over?'over-txt':''}">${over? '超支 ' : '剩餘 '}<b>${fmt(Math.abs(cap-spent))}</b></div>
        <div class="cap-edit">
          <label>調整上限</label>
          <input type="number" min="0" step="1" value="${cap}" data-envid="${def.id}">
        </div>
      `;
      grid.appendChild(el);
    });
    grid.querySelectorAll('.cap-edit input').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const id = inp.dataset.envid;
        const v = Math.max(0, Number(inp.value)||0);
        state.envelopes.find(e=>e.id===id).cap = v;
        await saveState();
        render();
      });
    });
  }

  function renderCardNote(){
    const note = document.getElementById('cardNote');
    const bound = state.linePayBoundToCard !== false;
    const cardSpent = spentOf('card');
    const lpSpent = spentOf('linepay');
    const combined = bound ? cardSpent + lpSpent : cardSpent;
    const combinedCap = bound ? capOf('card') + capOf('linepay') : capOf('card');
    note.innerHTML = `
      <label class="bind-toggle"><input type="checkbox" id="bindToggle" ${bound?'checked':''}> LINE Pay 綁定信用卡</label>
      — 若綁定，LINE Pay 消費會併入信用卡帳單。目前信用卡帳單估計：
      <b>${fmt(combined)}</b> / 上限 <b>${fmt(combinedCap)}</b>
      ${combined>combinedCap ? '　⚠ 已超過合併上限，繳款前請確認能否全額繳清' : ''}
    `;
    document.getElementById('bindToggle').addEventListener('change', async (e)=>{
      state.linePayBoundToCard = e.target.checked;
      await saveState();
      renderCardNote();
    });
  }

  function renderMethodSelect(){
    const sel = document.getElementById('txMethod');
    if(sel.dataset.built==='1') return;
    ENVELOPE_DEFS.forEach(def=>{
      const o = document.createElement('option');
      o.value = def.id; o.textContent = def.name;
      sel.appendChild(o);
    });
    sel.dataset.built = '1';
  }

  function renderLedger(){
    const body = document.getElementById('ledgerBody');
    document.getElementById('txCount').textContent = state.transactions.length + ' 筆';
    if(state.transactions.length===0){
      body.innerHTML = `<tr class="empty-row"><td colspan="5">還沒有記錄，開始記下第一筆消費吧</td></tr>`;
      return;
    }
    const sorted = [...state.transactions].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    body.innerHTML = sorted.map(t=>{
      const def = ENVELOPE_DEFS.find(d=>d.id===t.method);
      return `
        <tr data-id="${t.id}">
          <td>${t.date}</td>
          <td><span class="method-tag"><span class="dot" style="background:var(${def.color})"></span>${def.name}</span></td>
          <td class="note-cell">${t.note ? escapeHtml(t.note) : '—'}</td>
          <td class="amt">${fmt(t.amount)}</td>
          <td><button class="del-btn" data-del="${t.id}" title="刪除">✕</button></td>
        </tr>
      `;
    }).join('');
    body.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        state.transactions = state.transactions.filter(t=>t.id !== btn.dataset.del);
        await saveState();
        render();
      });
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.getElementById('addForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const err = document.getElementById('formErr');
    err.style.display='none';
    const date = document.getElementById('txDate').value;
    const amount = Number(document.getElementById('txAmount').value);
    const method = document.getElementById('txMethod').value;
    const note = document.getElementById('txNote').value.trim();
    if(!date || !amount || amount<=0){
      err.textContent = '請填寫日期與大於 0 的金額';
      err.style.display='block';
      return;
    }
    state.transactions.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      date, amount, method, note
    });
    await saveState();
    document.getElementById('txAmount').value='';
    document.getElementById('txNote').value='';
    render();
  });

  // ===== stats page rendering =====
  async function renderStats(){
    renderDonut();
    renderDailyBars();
    renderEnvStatTable();
    await renderMonthCompare();
    renderTopNotes();
  }

  function renderDonut(){
    const donut = document.getElementById('donutChart');
    const legend = document.getElementById('donutLegend');
    const total = state.transactions.reduce((s,t)=>s+t.amount,0);
    document.getElementById('donutTotal').textContent = fmt(total);

    if(total===0){
      donut.style.background = 'var(--rule)';
      legend.innerHTML = `<div style="font-size:12.5px;color:var(--ink-soft);">還沒有交易資料</div>`;
      return;
    }
    let acc = 0;
    const stops = [];
    const rows = [];
    ENVELOPE_DEFS.forEach(def=>{
      const spent = spentOf(def.id);
      if(spent<=0) return;
      const pct = spent/total*100;
      const start = acc, end = acc+pct;
      stops.push(`var(${def.color}) ${start}% ${end}%`);
      acc = end;
      rows.push({def, spent, pct});
    });
    donut.style.background = `conic-gradient(${stops.join(',')})`;
    rows.sort((a,b)=>b.spent-a.spent);
    legend.innerHTML = rows.map(r=>`
      <div class="legend-row">
        <span class="dot" style="background:var(${r.def.color})"></span>
        <span class="lname">${r.def.name}</span>
        <span class="lval">${fmt(r.spent)}</span>
        <span class="lpct">${r.pct.toFixed(0)}%</span>
      </div>
    `).join('');
  }

  function renderDailyBars(){
    const cs = stripTime(cycleStart(state.monthKey));
    const daysInMonth = daysInCycle(state.monthKey);
    const todayKey = todayStr();
    const perDay = new Array(daysInMonth+1).fill(0);
    state.transactions.forEach(t=>{
      const d = stripTime(new Date(t.date + 'T00:00:00'));
      const offset = Math.round((d - cs) / 86400000) + 1;
      if(offset>=1 && offset<=daysInMonth){
        perDay[offset] += t.amount;
      }
    });
    const max = Math.max(...perDay, 1);
    const barsEl = document.getElementById('dailyBars');
    barsEl.innerHTML = '';
    for(let offset=1; offset<=daysInMonth; offset++){
      const d = new Date(cs); d.setDate(cs.getDate() + (offset-1));
      const dateStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const h = Math.max((perDay[offset]/max)*100, perDay[offset]>0?4:1);
      const col = document.createElement('div');
      col.className = 'bar-col';
      col.title = `${fmtMD(d)}：${fmt(perDay[offset])}`;
      col.innerHTML = `<div class="bar ${dateStr===todayKey?'today':''}" style="height:${h}%"></div>`;
      barsEl.appendChild(col);
    }
    const ce = cycleEnd(state.monthKey);
    document.getElementById('dailyAxis').innerHTML = `<span>${fmtMD(cs)}</span><span>${fmtMD(ce)}</span>`;
  }

  function renderEnvStatTable(){
    const rows = ENVELOPE_DEFS.map(def=>{
      const cap = capOf(def.id);
      const spent = spentOf(def.id);
      const pct = cap>0 ? Math.min((spent/cap)*100,100) : 0;
      const over = spent>cap;
      return `
        <tr>
          <td class="name"><span class="dot" style="background:var(${def.color})"></span>${def.name}</td>
          <td class="right">${fmt(spent)}</td>
          <td class="right">${fmt(cap)}</td>
          <td style="width:90px;">
            ${over?'超支':pct.toFixed(0)+'%'}
            <div class="mini-bar"><div class="mini-bar-fill" style="width:${Math.min(pct,100)}%; background:${over?'var(--warn)':'var('+def.color+')'}"></div></div>
          </td>
        </tr>
      `;
    }).join('');
    document.getElementById('envStatTable').innerHTML = `
      <tr><th>信封</th><th style="text-align:right;">已花</th><th style="text-align:right;">上限</th><th>使用率</th></tr>
      ${rows}
    `;
  }

  async function renderMonthCompare(){
    const wrap = document.getElementById('monthCompare');
    wrap.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);">載入中…</div>`;
    const prevKey = prevMonthKey(state.monthKey);
    const prevState = await loadStateFor(prevKey);
    const curTotal = state.transactions.reduce((s,t)=>s+t.amount,0);
    const prevTotal = prevState.transactions.reduce((s,t)=>s+t.amount,0);
    const diff = curTotal - prevTotal;
    const diffPct = prevTotal>0 ? (diff/prevTotal*100) : (curTotal>0?100:0);

    const rowsHtml = ENVELOPE_DEFS.map(def=>{
      const curS = spentOf(def.id);
      const prevS = prevState.transactions.filter(t=>t.method===def.id).reduce((s,t)=>s+t.amount,0);
      const d = curS - prevS;
      const cls = d>0?'up':(d<0?'down':'');
      const arrow = d>0?'▲':(d<0?'▼':'—');
      return `
        <div class="compare-row">
          <div class="lbl">${def.name}<span class="sub">上月 ${fmt(prevS)}</span></div>
          <div>
            <div class="val">${fmt(curS)}</div>
            <div class="delta ${cls}">${arrow} ${fmt(Math.abs(d))}</div>
          </div>
        </div>
      `;
    }).join('');

    wrap.innerHTML = `
      <div class="compare-row">
        <div class="lbl"><b>本月總支出</b><span class="sub">${monthLabel(prevKey)} → ${monthLabel(state.monthKey)}</span></div>
        <div>
          <div class="val">${fmt(curTotal)}</div>
          <div class="delta ${diff>0?'up':(diff<0?'down':'')}">${diff>0?'▲':diff<0?'▼':'—'} ${fmt(Math.abs(diff))}（${diffPct.toFixed(0)}%）</div>
        </div>
      </div>
      ${rowsHtml}
    `;
  }

  function renderTopNotes(){
    const box = document.getElementById('topNotes');
    const map = {};
    state.transactions.forEach(t=>{
      const key = (t.note||'').trim() || '（無備註）';
      map[key] = (map[key]||0) + t.amount;
    });
    const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(rows.length===0){
      box.innerHTML = `<div style="font-size:12.5px;color:var(--ink-soft);">還沒有交易資料</div>`;
      return;
    }
    box.innerHTML = rows.map(([note,amt])=>`
      <div class="top-note-row"><span>${escapeHtml(note)}</span><span class="amt">${fmt(amt)}</span></div>
    `).join('');
  }

  // tab wiring
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> switchPage(btn.dataset.page));
  });

  // init
  document.getElementById('txDate').value = todayStr();
  loadMonth(defaultCycleKey(new Date()));
})();
</script>
</body>
</html>
